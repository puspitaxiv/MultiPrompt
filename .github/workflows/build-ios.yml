name: Build iOS (unsigned .ipa)

on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Build (tanpa tanda tangan)
        run: |
          cd ios
          xcodebuild -project MultiPrompt.xcodeproj -scheme MultiPrompt \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Kemas menjadi .ipa
        run: |
          cd ios
          APP=$(find build -type d -name "*.app" | head -1)
          test -n "$APP"
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr MultiPrompt.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MultiPrompt-ipa
          path: ios/MultiPrompt.ipa
